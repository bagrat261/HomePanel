services:
  homepanel:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    env_file: .env
    volumes:
      - ./configuration:/app/configuration:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m
