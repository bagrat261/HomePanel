services:
  homepanel:
    build:
      context: .
      dockerfile: Dockerfile.renderer
    ports:
      - "127.0.0.1:8090:8090"
    env_file: .env
    environment:
      HOMEPANEL_DISPLAY_ENABLED: "true"
    volumes:
      - ./configuration:/app/configuration:ro
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 128
    shm_size: 256mb
